name: Auto-Sync Telemetry Metrics

on:
  schedule:
    # Corre todos los días a las 06:00 y 18:00 UTC (2 veces al día)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Permite ejecución manual con un click desde GitHub Actions
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Metric Discovery & Update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 update_metrics.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "No hay cambios en métricas ni nuevos repositorios."
          else
            git commit -m "chore(telemetry): auto-sync github metrics & new repos [skip ci]"
            git push
          fi
